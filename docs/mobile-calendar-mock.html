<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>筋トレサポート — 簡易記録モック</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #697386;
        --line: #e7eaf0;
        --surface: #ffffff;
        --canvas: #f6f7fa;
        --primary: #2563eb;
        --primary-soft: #eff6ff;
        --plan: #8b5cf6;
        --log: #0f9f6e;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }

      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      .app { max-width: 680px; margin: 0 auto; min-height: 100dvh; background: var(--surface); }
      .header {
        display: flex; align-items: center; justify-content: space-between;
        height: 58px; padding: 0 20px; border-bottom: 1px solid var(--line);
        position: sticky; top: 0; z-index: 2; background: rgb(255 255 255 / .96); backdrop-filter: blur(10px);
      }
      .brand { font-size: 16px; font-weight: 750; letter-spacing: -.02em; }
      .avatar { width: 30px; height: 30px; border: 0; border-radius: 50%; color: var(--primary); background: var(--primary-soft); }
      main { padding: 24px 16px 40px; }
      .eyebrow { margin: 0 0 5px; color: var(--muted); font-size: 13px; }
      h1 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
      .calendar-card { margin-top: 20px; border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
      .month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .month strong { font-size: 16px; }
      .month-nav { display: flex; gap: 6px; }
      .icon-button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
      .week, .dates { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
      .week { margin-bottom: 5px; color: var(--muted); font-size: 11px; }
      .dates { row-gap: 4px; }
      .date {
        position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 1;
        border: 0; border-radius: 50%; background: none; color: var(--ink); font-size: 14px;
      }
      .date.empty { pointer-events: none; }
      .date.selected { color: #fff; background: var(--primary); box-shadow: 0 4px 10px rgb(37 99 235 / .28); }
      .date .dot { position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--log); }
      .date.selected .dot { background: #bfdbfe; }
      .date .plan-dot { right: calc(50% - 8px); background: var(--plan); }
      .date .log-dot { left: calc(50% - 8px); }
      .hint { display: flex; align-items: center; gap: 7px; margin: 13px 2px 0; color: var(--muted); font-size: 12px; }
      .tap { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: var(--primary); font-size: 11px; }
      .day { padding-top: 26px; }
      .day-title { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
      .day-title h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
      .day-title span { color: var(--muted); font-size: 13px; }
      .section-label { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; font-size: 13px; font-weight: 700; }
      .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; color: var(--muted); background: #f0f2f5; font-size: 11px; }
      .entry { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; }
      .entry + .entry { margin-top: 8px; }
      .entry-mark { width: 4px; height: 35px; flex: 0 0 auto; border-radius: 4px; background: var(--log); }
      .entry.plan .entry-mark { background: var(--plan); }
      .entry-content { min-width: 0; flex: 1; }
      .entry-name { margin: 0; font-weight: 700; font-size: 15px; }
      .entry-meta { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
      .more { border: 0; background: transparent; color: var(--muted); font-size: 20px; }
      .add { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 48px; margin-top: 20px; border: 0; border-radius: 13px; color: #fff; background: var(--primary); font-weight: 700; }
      .add small { font-weight: 500; opacity: .78; }

      /* Add record bottom sheet: shown in this mock as the next state after tapping a date. */
      .sheet-backdrop { position: fixed; z-index: 10; inset: 0; display: flex; align-items: end; background: rgb(23 32 51 / .22); }
      .sheet { width: 100%; max-width: 680px; margin: 0 auto; padding: 10px 20px max(24px, env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; background: #fff; box-shadow: 0 -12px 35px rgb(23 32 51 / .14); }
      .handle { width: 38px; height: 4px; margin: 0 auto 15px; border-radius: 4px; background: #d6dae2; }
      .sheet-heading { display: flex; justify-content: space-between; align-items: baseline; }
      .sheet-heading h2 { margin: 0; font-size: 19px; }
      .sheet-heading time { color: var(--muted); font-size: 13px; }
      .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 18px 0; padding: 4px; border-radius: 11px; background: #f2f4f7; }
      .switch button { min-height: 36px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 13px; font-weight: 700; }
      .switch button.active { color: var(--ink); background: #fff; box-shadow: 0 1px 3px rgb(23 32 51 / .1); }
      label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 700; }
      input, textarea { width: 100%; border: 1px solid #d9dee8; border-radius: 11px; padding: 12px; outline: 0; }
      input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgb(37 99 235 / .12); }
      .optional { margin-top: 12px; border: 0; color: var(--primary); background: none; padding: 4px 0; font-size: 13px; font-weight: 700; }
      .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
      .details label { color: var(--muted); font-size: 11px; }
      .details input { min-width: 0; padding: 10px 8px; }
      .save { width: 100%; min-height: 48px; margin-top: 20px; border: 0; border-radius: 13px; color: #fff; background: var(--primary); font-weight: 700; }
      .annotation { position: fixed; z-index: 11; right: 18px; top: 70px; max-width: 210px; padding: 10px 12px; border-radius: 10px; color: #73520b; background: #fff7d9; box-shadow: 0 4px 14px rgb(23 32 51 / .12); font-size: 11px; line-height: 1.55; }

      @media (min-width: 681px) {
        body { padding: 24px; }
        .app { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
        .sheet { border-radius: 22px 22px 0 0; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">筋トレサポート</div>
        <button class="avatar" aria-label="設定">●</button>
      </header>
      <main>
        <p class="eyebrow">今日の予定と記録を、ひとつの場所で</p>
        <h1>カレンダー</h1>

        <section class="calendar-card" aria-label="2026年7月">
          <div class="month">
            <strong>2026年 7月</strong>
            <div class="month-nav"><button class="icon-button">‹</button><button class="icon-button">›</button></div>
          </div>
          <div class="week"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div>
          <div class="dates">
            <button class="date empty"></button><button class="date empty"></button>
            <button class="date">1</button><button class="date">2</button><button class="date">3</button><button class="date">4</button><button class="date">5</button>
            <button class="date">6</button><button class="date">7</button><button class="date">8</button><button class="date">9</button><button class="date">10</button><button class="date">11</button><button class="date">12</button>
            <button class="date">13</button><button class="date">14</button><button class="date">15<span class="dot log-dot"></span></button><button class="date">16</button><button class="date">17<span class="dot plan-dot"></span></button><button class="date">18</button><button class="date">19</button>
            <button class="date">20</button><button class="date">21</button><button class="date">22</button><button class="date">23</button><button class="date">24</button><button class="date">25</button><button class="date">26</button>
            <button class="date">27</button><button class="date">28</button><button class="date">29</button><button class="date selected">30<span class="dot log-dot"></span><span class="dot plan-dot"></span></button><button class="date">31</button>
          </div>
          <div class="hint"><span class="tap">+</span> 日付をタップすると、予定または記録を追加できます</div>
        </section>

        <section class="day">
          <div class="day-title"><h2>7月30日（木）</h2><span>今日</span></div>
          <div class="section-label">予定 <span class="count">1</span></div>
          <article class="entry plan"><span class="entry-mark"></span><div class="entry-content"><p class="entry-name">胸・腕トレーニング</p><p class="entry-meta">18:00　詳細なし</p></div><button class="more" aria-label="予定の操作">⋯</button></article>
          <div class="section-label">記録 <span class="count">1</span></div>
          <article class="entry"><span class="entry-mark"></span><div class="entry-content"><p class="entry-name">スクワット</p><p class="entry-meta">3セット × 10回　60kg</p></div><button class="more" aria-label="記録の操作">⋯</button></article>
          <button class="add">＋ 追加する <small>予定 / 記録</small></button>
        </section>
      </main>
    </div>

    <div class="annotation">モックでは「7月30日をタップ後」の追加シートを重ねて表示しています。初期入力は種目名だけです。</div>
    <div class="sheet-backdrop" aria-label="追加シートのモック">
      <section class="sheet">
        <div class="handle"></div>
        <div class="sheet-heading"><h2>追加する</h2><time>7月30日（木）</time></div>
        <div class="switch"><button class="active">記録</button><button>予定</button></div>
        <label for="exercise">何をしましたか？</label>
        <input id="exercise" placeholder="例：スクワット" autocomplete="off" />
        <button class="optional">＋ セット数・回数・重量を追加</button>
        <div class="details">
          <div><label for="sets">セット数（任意）</label><input id="sets" inputmode="numeric" placeholder="3" /></div>
          <div><label for="reps">回数（任意）</label><input id="reps" inputmode="numeric" placeholder="10" /></div>
          <div><label for="weight">重量 kg（任意）</label><input id="weight" inputmode="decimal" placeholder="60" /></div>
        </div>
        <button class="save">記録を追加</button>
      </section>
    </div>
  </body>
</html>
